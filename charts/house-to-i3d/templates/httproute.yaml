{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled needs httpRoute.parentRefs: the Gateway to attach to, like [{name: gateway, namespace: gateway-system}]." }}
{{- end }}
{{- if not .Values.httpRoute.hostnames }}
{{- fail "httpRoute.enabled needs httpRoute.hostnames, like [hus.example.se]." }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- fail "Use either ingress or httpRoute, not both." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hx.fullname" . }}
  labels:
    {{- include "hx.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    # Only the web app is exposed; it forwards /api/* to the API inside the cluster.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "hx.fullname" . }}-web
          port: {{ .Values.service.port }}
{{- end }}
