{{- if eq (include "hx.bundledPostgres" .) "true" -}}
{{- $pg := .Values.database.postgres -}}
{{- $full := include "hx.fullname" . -}}
{{- $secret := printf "%s-db" $full -}}
{{- /* The password: from values, else the one already in the Secret, else a new random one. */ -}}
{{- $pw := $pg.password -}}
{{- if not $pw -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $secret -}}
{{- if and $old $old.data (hasKey $old.data "POSTGRES_PASSWORD") -}}
{{- $pw = index $old.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $pw = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "hx.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # The database on the PVC keeps this password, so keep the Secret with it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $pw | b64enc }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" (urlquery $pg.username) (urlquery $pw) $full (urlquery $pg.database) | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "hx.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "hx.selector" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "hx.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $full }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "hx.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hx.selector" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "hx.podSecurity" . | nindent 8 }}
        # the alpine image's "postgres" user
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: {{ printf "%s/%s:%s" .Values.image.registry $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: POSTGRES_PASSWORD
            # A subfolder, so the volume's own files (like lost+found) don't get in the way.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            {{- include "hx.containerSecurity" . | nindent 12 }}
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # PVCs made from this template are not deleted by helm uninstall, so the data stays.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "hx.selector" (list . "postgres") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
