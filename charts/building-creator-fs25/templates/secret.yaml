{{- /* App secrets: Google credentials, the Anthropic API key and the URL of your own Postgres, when given as values. */ -}}
{{- $g := .Values.google -}}
{{- $pg := .Values.database.postgres -}}
{{- $googleHere := and (not $g.existingSecret) $g.clientId $g.clientSecret -}}
{{- $c := .Values.claude -}}
{{- $claudeHere := and (not $c.existingSecret) $c.apiKey -}}
{{- $urlHere := and (eq .Values.database.type "postgres") (not $pg.deploy) (not $pg.existingSecret) $pg.url -}}
{{- if or $googleHere $urlHere $claudeHere }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hx.fullname" . }}
  labels:
    {{- include "hx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $googleHere }}
  GOOGLE_CLIENT_ID: {{ $g.clientId | b64enc }}
  GOOGLE_CLIENT_SECRET: {{ $g.clientSecret | b64enc }}
  {{- end }}
  {{- if $claudeHere }}
  ANTHROPIC_API_KEY: {{ $c.apiKey | b64enc }}
  {{- end }}
  {{- if $urlHere }}
  DATABASE_URL: {{ $pg.url | b64enc }}
  {{- end }}
{{- end }}
