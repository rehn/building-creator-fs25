name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Pushing a tag vX.Y.Z (or vX.Y.Z-rc.1) releases: tests, images, chart and a GitHub release. A push to main runs nothing.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

# Tests (backend, chart, frontend) run only when a release is made (a tag vX.Y.Z). A pull request only gets the Docker build check and a push to
# main runs nothing (there is no edge image: only releases are used). Run the tests locally before a release (see CLAUDE.md "How we work").

# A new push to the same pull request stops the older run. Branch and tag runs always finish (they publish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The store tests run twice: on SQLite and on this Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: if [ -f go.sum ]; then go mod download; else go mod tidy; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Test the store on Postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./internal/store/

  chart:
    name: Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.5
      - name: Lint and render tests
        run: bash charts/test.sh

  frontend:
    name: Frontend tests and build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Next.js reuses what it compiled before when the sources are mostly the same.
      - name: Cache the Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        run: npm test
      - name: Build (includes type checking)
        run: npm run build

  # Pull request: does the image build? amd64 only (arm64 goes through QEMU and is the slowest step), nothing is pushed,
  # and it does not wait for the tests: it runs beside them.
  docker-check:
    name: Docker build check (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }}-pr,mode=max

  # A tag (release): after all tests, for amd64 and arm64.
  docker:
    name: Docker image (${{ matrix.name }})
    needs: [backend, frontend, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/building-creator-fs25-${{ matrix.name }}
          tags: |
            # Release v1.2.3 -> 1.2.3, 1.2, 1 and latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Tag v1.2.3 -> chart 1.2.3 (app version 1.2.3) at oci://registry-1.docker.io/<DOCKERHUB_USERNAME>/building-creator-fs25
  helm:
    name: Publish Helm chart
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.5
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/building-creator-fs25 --version "$version" --app-version "$version" --destination dist
      - name: Push to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          helm push dist/building-creator-fs25-*.tgz "oci://registry-1.docker.io/$DOCKERHUB_USERNAME"

  # Tag v1.2.3 -> GitHub release with generated notes (skipped if one exists, e.g. made in the UI).
  release:
    name: GitHub release
    needs: [helm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.2.3-rc.1) is a pre-release: it does not become "latest".
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; *) flags="" ;; esac
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags
